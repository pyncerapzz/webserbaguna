<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PengingatKu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="app">

    <header>
      <div>
        <h1>PengingatKu</h1>
        <p>Jam & pengingat pribadi</p>
      </div>

      <button id="themeBtn">🌙</button>
    </header>

    <main>

      <section class="clock-card">
        <div id="clock">00:00:00</div>
        <div id="date">Memuat tanggal...</div>
      </section>

      <section class="reminder-card">
        <h2>🔔 Tambah Pengingat</h2>

        <input
          type="text"
          id="reminderText"
          placeholder="Contoh: Belajar, makan, tidur..."
        >

        <div class="form-row">
          <input type="date" id="reminderDate">
          <input type="time" id="reminderTime">
        </div>

        <button class="add-btn" id="addReminder">
          + Tambah Pengingat
        </button>
      </section>

      <section class="list-card">
        <div class="section-title">
          <h2>📋 Pengingat Saya</h2>
          <span id="count">0</span>
        </div>

        <div id="reminderList">
          <p class="empty">Belum ada pengingat.</p>
        </div>
      </section>

      <section class="gift-card">
        <div class="gift">🎁</div>
        <h2>Hadiah kecil buat kamu</h2>
        <p>Klik hadiahnya 👀</p>
        <button id="giftBtn">Buka Gift</button>
      </section>

    </main>

    <footer>
      PengingatKu • Versi 1.0
    </footer>

  </div>

  <div class="popup hidden" id="popup">
    <div class="popup-box">
      <div class="popup-icon">🎉</div>
      <h2 id="popupTitle">Pengingat!</h2>
      <p id="popupMessage"></p>
      <button id="closePopup">Oke</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
